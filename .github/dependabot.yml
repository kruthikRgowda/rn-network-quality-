version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # React Native pins a compatible React pair. Upgrade these only when
      # upgrading React Native and validating the complete combination.
      - dependency-name: react
      - dependency-name: react-test-renderer
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
